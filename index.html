<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiteCanvas — HTMLサイトエディター</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
  <div class="brand"><span class="brand-icon" aria-hidden="true">▧</span>SiteCanvas</div>
  <div class="top-actions">
    <button class="action" id="new">新規作成</button>
    <button class="action" id="open">ファイルを開く</button>
    <button class="action" id="preview">プレビュー</button>
    <button class="action primary" id="export">HTMLを書き出す</button>
  </div>
</header>
<main class="editor">
  <aside class="panel left" aria-label="要素・レイヤー・ファイル">
    <h2 id="add-heading">要素を追加</h2>
    <div class="add-grid" id="add-tools">
      <button class="action" data-add="text"><span class="add-icon" aria-hidden="true">T</span>テキスト</button>
      <button class="action" data-add="image"><span class="add-icon" aria-hidden="true">▧</span>画像</button>
      <button class="action" data-add="button"><span class="add-icon" aria-hidden="true">▣</span>ボタン</button>
      <button class="action" data-add="shape"><span class="add-icon" aria-hidden="true">■</span>四角形</button>
      <button class="action" data-add="header"><span class="region-icon" aria-hidden="true"></span>ヘッダー</button>
      <button class="action" data-add="footer"><span class="region-icon" aria-hidden="true"></span>フッター</button>
    </div>
    <div class="switch sidebar-switch" aria-label="左パネルの表示">
      <button class="action" id="layers-tab" aria-controls="layers-panel" aria-pressed="true">レイヤー</button>
      <button class="action" id="files-tab" aria-controls="files-panel" aria-pressed="false">ファイル</button>
    </div>
    <section id="layers-panel" aria-labelledby="layers-tab">
      <div class="tools layer-tools" id="layer-tools">
        <button class="action icon-button" id="front" title="前面へ一段移動" aria-label="前面へ一段移動">↑</button>
        <button class="action icon-button" id="back" title="背面へ一段移動" aria-label="背面へ一段移動">↓</button>
      </div>
      <div class="layers" id="layers"></div>
    </section>
    <section id="files-panel" aria-labelledby="files-tab" hidden>
      <div class="file-tree" id="file-tree"></div>
    </section>
  </aside>
  <section class="stage" aria-label="キャンバス">
    <div class="stagebar">
      <div class="switch" aria-label="編集する画面幅">
        <button class="action" data-view="desktop" aria-pressed="true">PC</button>
        <button class="action" data-view="mobile" aria-pressed="false">スマホ</button>
      </div>
      <span class="stage-size" id="stage-size"></span>
      <div class="tools">
        <button class="action" id="inspect-toggle" aria-pressed="false" aria-controls="source-sheet properties">要素検査</button>
        <button class="action" id="code-toggle" aria-pressed="false" aria-controls="code-panel">コード</button>
        <button class="action icon-button" id="undo" title="元に戻す" aria-label="元に戻す">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path id="undo-arrow" d="M9 4 4 9l5 5M4 9h11a5 5 0 0 1 0 10h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="action icon-button" id="redo" title="やり直す" aria-label="やり直す">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <use href="#undo-arrow" transform="translate(24 0) scale(-1 1)"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="save-strip">
      <span id="save-state" role="status"></span>
      <span id="save-time" hidden>最終保存 <time id="saved-at"></time></span>
    </div>
    <section id="code-panel" class="code-panel" aria-labelledby="code-heading" hidden>
      <div class="code-bar">
        <h2 id="code-heading"><label for="source-code">HTML / CSS</label></h2>
        <div class="tools">
          <button class="action" id="code-reset">変更を破棄</button>
          <button class="action primary" id="code-apply">コードを反映</button>
        </div>
      </div>
      <textarea id="source-code" wrap="off" spellcheck="false" autocapitalize="off" aria-describedby="code-help"></textarea>
      <p id="code-help" class="help"></p>
    </section>
    <div class="viewport" id="viewport">
      <div class="sheet-shell" id="shell">
        <div class="sheet" id="sheet" tabindex="0" aria-label="デザインキャンバス"></div>
        <iframe class="sheet source-sheet" id="source-sheet" title="HTML 編集キャンバス" sandbox="allow-same-origin" hidden></iframe>
        <div id="source-outline" aria-hidden="true" hidden></div>
        <div id="inspect-box" class="inspect-box" aria-hidden="true" hidden>
          <span class="inspect-margin"></span><span class="inspect-border"></span>
          <span class="inspect-padding"></span><span class="inspect-content"></span>
        </div>
        <div id="inspect-tooltip" class="inspect-tooltip" aria-hidden="true" hidden></div>
        <button type="button" id="source-resize" class="source-resize" tabindex="-1" aria-label="ドラッグしてサイズ変更" title="ドラッグしてサイズ変更" hidden></button>
        <div id="canvas-spacing" class="canvas-spacing" hidden>
          <div class="canvas-spacing-controls">
            <div class="canvas-spacing-bar" role="group" aria-label="キャンバスの余白編集">
              <span>余白</span>
              <button type="button" id="close-spacing" aria-label="余白編集を閉じる">×</button>
            </div>
            <div class="canvas-spacing-grips">
              <div class="canvas-spacing-row" data-side="top" data-side-label="上">
                <span class="canvas-spacing-name">上</span>
                <button type="button" class="canvas-spacing-grip" data-mode="margin" data-side="top" data-side-label="外"></button>
                <button type="button" class="canvas-spacing-grip" data-mode="padding" data-side="top" data-side-label="内"></button>
              </div>
              <div class="canvas-spacing-row" data-side="right" data-side-label="右">
                <span class="canvas-spacing-name">右</span>
                <button type="button" class="canvas-spacing-grip" data-mode="padding" data-side="right" data-side-label="内"></button>
                <button type="button" class="canvas-spacing-grip" data-mode="margin" data-side="right" data-side-label="外"></button>
              </div>
              <div class="canvas-spacing-row" data-side="bottom" data-side-label="下">
                <span class="canvas-spacing-name">下</span>
                <button type="button" class="canvas-spacing-grip" data-mode="padding" data-side="bottom" data-side-label="内"></button>
                <button type="button" class="canvas-spacing-grip" data-mode="margin" data-side="bottom" data-side-label="外"></button>
              </div>
              <div class="canvas-spacing-row" data-side="left" data-side-label="左">
                <span class="canvas-spacing-name">左</span>
                <button type="button" class="canvas-spacing-grip" data-mode="margin" data-side="left" data-side-label="外"></button>
                <button type="button" class="canvas-spacing-grip" data-mode="padding" data-side="left" data-side-label="内"></button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <p class="dimensions" id="canvas-help">ドラッグで移動 · 角のつまみでサイズ変更</p>
    </div>
  </section>
  <aside class="panel right" aria-label="プロパティ">
    <h2 id="properties-title">ページ設定</h2>
    <div id="properties"></div>
  </aside>
</main>
<input type="file" id="file-open" accept=".html,.htm,text/html" hidden>
<input type="file" id="file-image" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" hidden>
<div class="status" id="status" role="status"></div>
<dialog id="preview-dialog" aria-labelledby="preview-heading">
  <div class="dialog-bar">
    <strong id="preview-heading">サイトのプレビュー</strong>
    <div class="tools">
      <div class="switch" aria-label="プレビューの幅">
        <button class="action" data-preview="desktop" aria-pressed="true">PC</button>
        <button class="action" data-preview="mobile" aria-pressed="false">スマホ</button>
      </div>
      <form method="dialog"><button class="action">閉じる</button></form>
    </div>
  </div>
  <div class="preview-frame" id="preview-frame"><iframe title="サイトのプレビュー" sandbox></iframe></div>
</dialog>
<script src="./script.js" defer></script>
</body>
</html>
